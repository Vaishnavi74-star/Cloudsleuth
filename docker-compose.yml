services:
  cloudsleuth:
    build:
      context: .
      dockerfile: Dockerfile
    image: cloudsleuth:latest
    container_name: cloudsleuth
    ports:
      - "8501:8501"
    # Loads GEMMA_API_KEY and GEMMA_MODEL from local .env if present
    env_file:
      - path: .env
        required: false
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
